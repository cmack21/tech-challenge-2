apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
        - name: hello-world
          image: 691652240094.dkr.ecr.us-east-2.amazonaws.com/hello-world-app:latest
          ports:
            - containerPort: 3000
